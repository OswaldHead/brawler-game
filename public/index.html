<!DOCTYPE html>
<html>
<head>
  <title>Brawler Game</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #111;
    }
    canvas {
      display: block;
      background: #222;
    }
  </style>
</head>
<body>

<canvas id="game"></canvas>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>

const socket = io();

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const keys = {};
const targets = {};
const renderPlayers = {};
const bullets = [];

let myId = null;

/* ---------------- INPUT ---------------- */
document.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
document.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

/* ---------------- SHOOT ---------------- */
document.addEventListener("click", (e) => {
  const me = renderPlayers[myId];
  if (!me) return;

  const angle = Math.atan2(e.clientY - me.y, e.clientX - me.x);

  const bullet = {
    x: me.x,
    y: me.y,
    vx: Math.cos(angle) * 8,
    vy: Math.sin(angle) * 8
  };

  bullets.push(bullet);
  socket.emit("shoot", bullet);
});

/* ---------------- SOCKET ---------------- */
socket.on("connect", () => {
  myId = socket.id;
});

socket.on("currentPlayers", (data) => {
  for (let id in data) {
    targets[id] = data[id];
    renderPlayers[id] = { x: data[id].x, y: data[id].y };
  }
});

socket.on("newPlayer", ({ id, data }) => {
  targets[id] = data;
  renderPlayers[id] = { x: data.x, y: data.y };
});

socket.on("removePlayer", (id) => {
  delete targets[id];
  delete renderPlayers[id];
});

/* ---------------- STATE UPDATE ---------------- */
socket.on("state", (serverPlayers) => {

  for (let id in serverPlayers) {
    if (!targets[id]) {
      targets[id] = serverPlayers[id];
      renderPlayers[id] = { x: serverPlayers[id].x, y: serverPlayers[id].y };
    }

    targets[id].x = serverPlayers[id].x;
    targets[id].y = serverPlayers[id].y;
    targets[id].hp = serverPlayers[id].hp;
  }

  for (let id in targets) {
    if (!serverPlayers[id]) {
      delete targets[id];
      delete renderPlayers[id];
    }
  }
});

/* ---------------- UPDATE ---------------- */
function update() {
  const me = renderPlayers[myId];
  if (!me) return;

  /* 🔥 CLIENT PREDICTION (fixes lag feel) */
  if (keys["w"]) me.y -= 4;
  if (keys["s"]) me.y += 4;
  if (keys["a"]) me.x -= 4;
  if (keys["d"]) me.x += 4;

  socket.emit("move", {
    w: keys["w"],
    a: keys["a"],
    s: keys["s"],
    d: keys["d"]
  });

  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];

    b.x += b.vx;
    b.y += b.vy;

    if (
      b.x < 0 || b.x > canvas.width ||
      b.y < 0 || b.y > canvas.height
    ) {
      bullets.splice(i, 1);
    }
  }
}

/* ---------------- DRAW (SMOOTHING) ---------------- */
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let id in targets) {

    if (!renderPlayers[id]) {
      renderPlayers[id] = { x: targets[id].x, y: targets[id].y };
    }

    const isMe = id === myId;

    if (!isMe) {
      renderPlayers[id].x += (targets[id].x - renderPlayers[id].x) * 0.25;
      renderPlayers[id].y += (targets[id].y - renderPlayers[id].y) * 0.25;
    } else {
      renderPlayers[id].x = targets[id].x;
      renderPlayers[id].y = targets[id].y;
    }

    ctx.fillStyle = isMe ? "cyan" : "red";
    ctx.beginPath();
    ctx.arc(renderPlayers[id].x, renderPlayers[id].y, 20, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "white";
    ctx.fillText("HP: " + targets[id].hp, renderPlayers[id].x - 15, renderPlayers[id].y - 30);
  }

  ctx.fillStyle = "yellow";
  bullets.forEach(b => {
    ctx.beginPath();
    ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
    ctx.fill();
  });
}

/* ---------------- LOOP ---------------- */
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
