<!DOCTYPE html>
<html>
<head>
  <title>Brawler Game</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #111;
    }
    canvas {
      display: block;
      background: #222;
    }
  </style>
</head>
<body>

<canvas id="game"></canvas>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>

const socket = io(); /* 🔥 FIX: same-origin connection */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const keys = {};
const players = {};
const bullets = [];

let myId = null;

/* ---------------- INPUT ---------------- */
document.addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;
});

document.addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});

/* ---------------- SHOOT ---------------- */
document.addEventListener("click", (e) => {
  const me = players[myId];
  if (!me) return;

  const angle = Math.atan2(e.clientY - me.y, e.clientX - me.x);

  const bullet = {
    x: me.x,
    y: me.y,
    vx: Math.cos(angle) * 8,
    vy: Math.sin(angle) * 8
  };

  bullets.push(bullet);
  socket.emit("shoot", bullet);
});

/* ---------------- SOCKET ---------------- */
socket.on("connect", () => {
  myId = socket.id;
});

socket.on("currentPlayers", (serverPlayers) => {
  for (let id in serverPlayers) {
    players[id] = serverPlayers[id];
  }
});

socket.on("newPlayer", ({ id, data }) => {
  players[id] = data;
});

socket.on("removePlayer", (id) => {
  delete players[id];
});

/* 🔥 STATE SYNC (FIXED) */
socket.on("state", (serverPlayers) => {

  for (let id in players) {
    if (!serverPlayers[id]) {
      delete players[id];
    }
  }

  for (let id in serverPlayers) {
    players[id] = serverPlayers[id];
  }
});

/* ---------------- UPDATE ---------------- */
function update() {
  const me = players[myId];
  if (!me) return;

  /* send input only */
  socket.emit("move", {
    w: keys["w"],
    a: keys["a"],
    s: keys["s"],
    d: keys["d"]
  });

  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];

    b.x += b.vx;
    b.y += b.vy;

    if (
      b.x < 0 || b.x > canvas.width ||
      b.y < 0 || b.y > canvas.height
    ) {
      bullets.splice(i, 1);
    }
  }
}

/* ---------------- DRAW ---------------- */
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let id in players) {
    const p = players[id];

    ctx.fillStyle = id === myId ? "cyan" : "red";
    ctx.beginPath();
    ctx.arc(p.x, p.y, 20, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "white";
    ctx.fillText("HP: " + p.hp, p.x - 15, p.y - 30);
  }

  ctx.fillStyle = "yellow";
  bullets.forEach(b => {
    ctx.beginPath();
    ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
    ctx.fill();
  });
}

/* ---------------- LOOP ---------------- */
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
