<!DOCTYPE html>
<html>
<head>
  <title>Brawler Game</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #111;
    }
    canvas {
      display: block;
      background: #222;
    }
  </style>
</head>
<body>

<canvas id="game"></canvas>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>

const socket = io(); // same domain = best stability

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const keys = {};

/* 🔥 TARGETS + SMOOTH POSITIONS */
const targets = {};
const players = {};
const bullets = [];

let myId = null;

/* ---------------- INPUT ---------------- */
document.addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;
});

document.addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});

/* ---------------- SHOOT ---------------- */
document.addEventListener("click", (e) => {
  const me = players[myId];
  if (!me) return;

  const angle = Math.atan2(e.clientY - me.y, e.clientX - me.x);

  const bullet = {
    x: me.x,
    y: me.y,
    vx: Math.cos(angle) * 8,
    vy: Math.sin(angle) * 8
  };

  bullets.push(bullet);
  socket.emit("shoot", bullet);
});

/* ---------------- SOCKET ---------------- */
socket.on("connect", () => {
  myId = socket.id;
});

socket.on("currentPlayers", (serverPlayers) => {
  for (let id in serverPlayers) {
    targets[id] = serverPlayers[id];
    players[id] = { x: serverPlayers[id].x, y: serverPlayers[id].y };
  }
});

socket.on("newPlayer", ({ id, data }) => {
  targets[id] = data;
  players[id] = { x: data.x, y: data.y };
});

socket.on("removePlayer", (id) => {
  delete targets[id];
  delete players[id];
});

/* 🔥 STATE UPDATE */
socket.on("state", (serverPlayers) => {

  for (let id in serverPlayers) {
    if (!targets[id]) {
      targets[id] = serverPlayers[id];
      players[id] = { x: serverPlayers[id].x, y: serverPlayers[id].y };
    }

    targets[id].x = serverPlayers[id].x;
    targets[id].y = serverPlayers[id].y;
    targets[id].hp = serverPlayers[id].hp;
  }

  for (let id in targets) {
    if (!serverPlayers[id]) {
      delete targets[id];
      delete players[id];
    }
  }
});

/* ---------------- UPDATE ---------------- */
function update() {
  const me = players[myId];
  if (!me) return;

  socket.emit("move", {
    w: keys["w"],
    a: keys["a"],
    s: keys["s"],
    d: keys["d"]
  });

  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];

    b.x += b.vx;
    b.y += b.vy;

    if (
      b.x < 0 || b.x > canvas.width ||
      b.y < 0 || b.y > canvas.height
    ) {
      bullets.splice(i, 1);
    }
  }
}

/* ---------------- DRAW (SMOOTHING HERE) ---------------- */
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let id in targets) {

    if (!players[id]) {
      players[id] = { x: targets[id].x, y: targets[id].y };
    }

    // 🔥 SMOOTH INTERPOLATION
    players[id].x += (targets[id].x - players[id].x) * 0.15;
    players[id].y += (targets[id].y - players[id].y) * 0.15;

    ctx.fillStyle = id === myId ? "cyan" : "red";
    ctx.beginPath();
    ctx.arc(players[id].x, players[id].y, 20, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "white";
    ctx.fillText("HP: " + (targets[id].hp || 100), players[id].x - 15, players[id].y - 30);
  }

  ctx.fillStyle = "yellow";
  bullets.forEach(b => {
    ctx.beginPath();
    ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
    ctx.fill();
  });
}

/* ---------------- LOOP ---------------- */
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
