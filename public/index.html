<!DOCTYPE html>
<html>
<head>
  <title>Brawler Game</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #111;
    }
    canvas {
      display: block;
      background: #222;
    }
  </style>
</head>
<body>

<canvas id="game"></canvas>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>

const socket = io();

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

/* ---------------- STATE ---------------- */
const keys = {};
const snapshots = {};
const render = {};
let bullets = [];

let myId = null;

/* ---------------- INPUT ---------------- */
document.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
document.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

/* ---------------- SHOOT ---------------- */
document.addEventListener("click", (e) => {
  const me = getMe();
  if (!me) return;

  const angle = Math.atan2(e.clientY - me.y, e.clientX - me.x);

  socket.emit("shoot", { angle });
});

/* ---------------- SOCKET ---------------- */
socket.on("connect", () => {
  myId = socket.id;
});

socket.on("init", (data) => {
  for (let id in data) {
    snapshots[id] = [{
      ...data[id],
      t: Date.now()
    }];

    render[id] = { x: data[id].x, y: data[id].y };
  }
});

/* 🔥 MAIN STATE UPDATE */
socket.on("state", (data) => {

  const now = Date.now();

  /* players */
  for (let id in data.players) {

    if (!snapshots[id]) snapshots[id] = [];

    snapshots[id].push({
      ...data.players[id],
      t: now
    });

    if (snapshots[id].length > 10) {
      snapshots[id].shift();
    }
  }

  /* remove disconnected */
  for (let id in snapshots) {
    if (!data.players[id]) {
      delete snapshots[id];
      delete render[id];
    }
  }

  /* bullets from server */
  bullets = data.bullets;
});

socket.on("remove", (id) => {
  delete snapshots[id];
  delete render[id];
});

/* ---------------- INPUT SEND ---------------- */
function update() {
  socket.emit("input", {
    w: keys["w"],
    a: keys["a"],
    s: keys["s"],
    d: keys["d"]
  });
}

/* ---------------- HELPERS ---------------- */
function getMe() {
  const list = snapshots[myId];
  if (!list) return null;
  return list[list.length - 1];
}

function getInterpolated(id) {
  const list = snapshots[id];
  if (!list || list.length === 0) return null;

  const renderTime = Date.now() - 100;

  let i = list.length - 1;
  while (i > 0 && list[i].t > renderTime) i--;

  return list[i];
}

/* ---------------- DRAW ---------------- */
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  /* players */
  for (let id in snapshots) {

    const state = getInterpolated(id);
    if (!state) continue;

    if (!render[id]) {
      render[id] = { x: state.x, y: state.y };
    }

    const isMe = id === myId;

    if (!isMe) {
      render[id].x += (state.x - render[id].x) * 0.3;
      render[id].y += (state.y - render[id].y) * 0.3;
    } else {
      render[id].x = state.x;
      render[id].y = state.y;
    }

    ctx.fillStyle = isMe ? "cyan" : "red";
    ctx.beginPath();
    ctx.arc(render[id].x, render[id].y, 20, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "white";
    ctx.fillText("HP: " + (state.hp || 100), render[id].x - 15, render[id].y - 30);
  }

  /* bullets */
  ctx.fillStyle = "yellow";
  bullets.forEach(b => {
    ctx.beginPath();
    ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
    ctx.fill();
  });
}

/* ---------------- LOOP ---------------- */
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
