<!DOCTYPE html>
<html>
<head>
  <title>Brawler Game</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #111;
    }
    canvas {
      display: block;
      background: #222;
    }
  </style>
</head>
<body>

<canvas id="game"></canvas>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>

const socket = io();

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const keys = {};

/* ---------------- STATE ---------------- */
const serverState = {};
const renderState = {};

let myId = null;
const bullets = [];

/* ---------------- INPUT ---------------- */
document.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
document.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

/* ---------------- SHOOT ---------------- */
document.addEventListener("click", (e) => {
  const me = renderState[myId];
  if (!me) return;

  const angle = Math.atan2(e.clientY - me.y, e.clientX - me.x);

  const bullet = {
    x: me.x,
    y: me.y,
    vx: Math.cos(angle) * 8,
    vy: Math.sin(angle) * 8
  };

  bullets.push(bullet);
  socket.emit("shoot", bullet);
});

/* ---------------- SOCKET ---------------- */
socket.on("connect", () => {
  myId = socket.id;
});

socket.on("init", (data) => {
  for (let id in data) {
    serverState[id] = data[id];
    renderState[id] = { ...data[id] };
  }
});

socket.on("state", (data) => {
  for (let id in data) {
    if (!serverState[id]) {
      serverState[id] = data[id];
      renderState[id] = { ...data[id] };
    }

    serverState[id] = data[id];
  }

  for (let id in serverState) {
    if (!data[id]) {
      delete serverState[id];
      delete renderState[id];
    }
  }
});

socket.on("remove", (id) => {
  delete serverState[id];
  delete renderState[id];
});

/* ---------------- UPDATE (CLIENT PREDICTION) ---------------- */
function update() {
  const me = renderState[myId];
  if (!me) return;

  /* 🔥 instant movement (NO waiting for server) */
  if (keys["w"]) me.y -= 4;
  if (keys["s"]) me.y += 4;
  if (keys["a"]) me.x -= 4;
  if (keys["d"]) me.x += 4;

  socket.emit("input", {
    w: keys["w"],
    a: keys["a"],
    s: keys["s"],
    d: keys["d"]
  });

  /* bullets */
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];

    b.x += b.vx;
    b.y += b.vy;

    if (
      b.x < 0 || b.x > canvas.width ||
      b.y < 0 || b.y > canvas.height
    ) {
      bullets.splice(i, 1);
    }
  }
}

/* ---------------- DRAW (SMOOTH OTHERS ONLY) ---------------- */
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let id in serverState) {

    if (!renderState[id]) {
      renderState[id] = { ...serverState[id] };
    }

    const isMe = id === myId;

    if (!isMe) {
      /* smooth ONLY others */
      renderState[id].x += (serverState[id].x - renderState[id].x) * 0.35;
      renderState[id].y += (serverState[id].y - renderState[id].y) * 0.35;
    } else {
      /* lock self to prediction */
      renderState[id].x = serverState[id].x;
      renderState[id].y = serverState[id].y;
    }

    ctx.fillStyle = isMe ? "cyan" : "red";
    ctx.beginPath();
    ctx.arc(renderState[id].x, renderState[id].y, 20, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "white";
    ctx.fillText("HP: " + (serverState[id].hp || 100),
      renderState[id].x - 15,
      renderState[id].y - 30
    );
  }

  ctx.fillStyle = "yellow";
  bullets.forEach(b => {
    ctx.beginPath();
    ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
    ctx.fill();
  });
}

/* ---------------- LOOP ---------------- */
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
