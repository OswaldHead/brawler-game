<!DOCTYPE html>
<html>
<head>
  <title>Brawler Game</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; }
    canvas { display: block; background: #222; }
  </style>
</head>
<body>

<canvas id="game"></canvas>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>

const socket = io();

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

/* ---------------- INPUT ---------------- */
const keys = {};

/* ---------------- SNAPSHOT BUFFER ---------------- */
const snapshots = {};

let myId = null;
const bullets = [];

/* ---------------- INPUT ---------------- */
document.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
document.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

/* ---------------- SHOOT ---------------- */
document.addEventListener("click", (e) => {
  const me = snapshots[myId]?.slice(-1)[0];
  if (!me) return;

  const angle = Math.atan2(e.clientY - me.y, e.clientX - me.x);

  bullets.push({
    x: me.x,
    y: me.y,
    vx: Math.cos(angle) * 8,
    vy: Math.sin(angle) * 8
  });

  socket.emit("shoot", bullets[bullets.length - 1]);
});

/* ---------------- SOCKET ---------------- */
socket.on("connect", () => {
  myId = socket.id;
});

socket.on("init", (data) => {
  for (let id in data) {
    snapshots[id] = [{
      ...data[id],
      t: Date.now()
    }];
  }
});

socket.on("state", (data) => {
  const now = Date.now();

  for (let id in data) {
    if (!snapshots[id]) snapshots[id] = [];

    snapshots[id].push({
      x: data[id].x,
      y: data[id].y,
      hp: data[id].hp,
      t: now
    });

    if (snapshots[id].length > 10) {
      snapshots[id].shift();
    }
  }
});

socket.on("remove", (id) => {
  delete snapshots[id];
});

/* ---------------- INPUT SEND ---------------- */
function update() {
  socket.emit("input", {
    w: keys["w"],
    a: keys["a"],
    s: keys["s"],
    d: keys["d"]
  });

  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];

    b.x += b.vx;
    b.y += b.vy;

    if (
      b.x < 0 || b.x > canvas.width ||
      b.y < 0 || b.y > canvas.height
    ) {
      bullets.splice(i, 1);
    }
  }
}

/* ---------------- INTERPOLATION (NO JITTER) ---------------- */
function getState(id) {
  const list = snapshots[id];
  if (!list || list.length === 0) return null;

  const renderTime = Date.now() - 100;

  let i = list.length - 1;
  while (i > 0 && list[i].t > renderTime) i--;

  return list[i];
}

/* ---------------- DRAW ---------------- */
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let id in snapshots) {

    const state = getState(id);
    if (!state) continue;

    ctx.fillStyle = id === myId ? "cyan" : "red";
    ctx.beginPath();
    ctx.arc(state.x, state.y, 20, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "white";
    ctx.fillText("HP: " + (state.hp || 100), state.x - 15, state.y - 30);
  }

  ctx.fillStyle = "yellow";
  bullets.forEach(b => {
    ctx.beginPath();
    ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
    ctx.fill();
  });
}

/* ---------------- LOOP ---------------- */
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
